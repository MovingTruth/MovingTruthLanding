notice_title: "शुरू करने से पहले"
notice_body_1: "ये कहानियाँ क्रम में पढ़े जाने के लिए लिखी गई हैं। हर शृंखला अपना अलग मार्ग है — आप किसी भी शृंखला को जब चाहें शुरू कर सकते हैं, लेकिन एक शृंखला के भीतर आपको पहली रचना से शुरू करना होगा।"
notice_body_2: "जब आप किसी रचना के अंत तक पहुँचेंगे, तो आगे बढ़ने से पहले आपसे तीस सेकंड उसके साथ ठहरने को कहा जाएगा। एक बार जब आप पूरी शृंखला पढ़ लेंगे, तो आप कभी भी उसके किसी भी हिस्से पर वापस लौट सकते हैं।"
notice_body_3: "आप जब चाहें अपनी प्रगति रीसेट करके इसे फिर से शुरू कर सकते हैं।"
