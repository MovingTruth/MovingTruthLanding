notice_title: Voordat je begint
notice_body_1: Deze verhalen zijn geschreven om in volgorde te worden gelezen. Elke serie is een eigen pad — je kunt elke serie beginnen wanneer je wilt, maar binnen een serie volg je de stukken vanaf het eerste.
notice_body_2: Wanneer je het einde van een stuk bereikt, wordt je gevraagd er dertig seconden bij stil te staan voordat je verdergaat. Zodra je een serie helemaal hebt gelezen, kun je op elk moment naar elk deel ervan terugkeren.
notice_body_3: Je kunt je voortgang altijd resetten en opnieuw beginnen.
